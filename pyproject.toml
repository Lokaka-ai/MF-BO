[project]
name = "mlevolve-bo"
version = "0.1.0"
description = "MLEvolve BO search runtime and local A100 autoresearch task"
requires-python = ">=3.12,<3.13"
dependencies = [
  "backoff>=2.2,<3",
  "black>=25,<27",
  "coolname>=2.2,<3",
  "dataclasses-json>=0.6.7,<0.7",
  "faiss-cpu==1.11.0",
  "funcy>=2,<3",
  "genson>=1.3,<2",
  "google-genai>=1.51,<2",
  "humanize>=4.8,<5",
  "jsonschema>=4.25,<5",
  "numpy>=2.2,<3",
  "omegaconf==2.3.0",
  "openai>=1.66,<3",
  "pandas>=2.3,<3",
  "pyarrow>=21,<24",
  "rank-bm25>=0.2.2,<0.3",
  "requests>=2.32.5,<3",
  "rich>=13.7,<15",
  "rustbpe==0.1.0",
  "scikit-learn>=1.6,<2",
  "scipy>=1.16,<2",
  "sentence-transformers==2.6.1",
  "shutup==0.2.0",
  "tiktoken>=0.11,<0.13",
  "torch==2.9.1",
  "transformers==4.57.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
